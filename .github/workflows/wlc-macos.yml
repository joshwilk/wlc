# Builds WLC.app for macOS from this fork and uploads a DMG.
# Run it from the Actions tab ("Run workflow"), or push a tag named wlc-*.
name: WLC for macOS

on:
  workflow_dispatch:
    inputs:
      intel:
        description: Also build for Intel Macs (doubles the build minutes)
        type: boolean
        default: false
  push:
    tags: ['wlc-*']

env:
  WLC_VERSION: "0.2.0"

jobs:
  build:
    name: WLC.app (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.optional }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        # kernel = the macOS version VideoLAN's prebuilt libraries are named for
        # (same values as VideoLAN's own CI in extras/ci/gitlab-ci.yml).
        # Intel is built only when asked for (or for wlc-* tags).
        include: ${{ fromJSON((github.event_name != 'workflow_dispatch' || inputs.intel) && '[{"arch":"aarch64","kernel":19,"job":"macos-arm64","runner":"macos-15","label":"apple-silicon","optional":false},{"arch":"x86_64","kernel":18,"job":"macos-x86_64","runner":"macos-15-intel","label":"intel","optional":true}]' || '[{"arch":"aarch64","kernel":19,"job":"macos-arm64","runner":"macos-15","label":"apple-silicon","optional":false}]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Build tools from Homebrew
        run: brew install autoconf automake libtool pkg-config gettext ffmpeg make zstd || true

      - name: Reuse third-party libraries built by an earlier run
        id: contribcache
        uses: actions/cache@v4
        with:
          path: |
            contrib/vlc-contrib-*.tar.*
          key: contribs-${{ matrix.arch }}-${{ hashFiles('contrib/src/**', 'tools-wlc/contrib-shas.txt') }}

      - name: Find VideoLAN's prebuilt third-party libraries
        run: |
          url=$(sh tools-wlc/find-prebuilt.sh ${{ matrix.job }} ${{ matrix.arch }}-apple-darwin${{ matrix.kernel }})
          echo "prebuilt: ${url:-none found, will build them from source}"
          cached=$(ls contrib/vlc-contrib-*.tar.* 2>/dev/null | head -1)
          if [ -n "$cached" ]; then url="file://$PWD/$cached"; echo "using libraries cached from an earlier run: $cached"; fi
          [ -n "$url" ] && echo "VLC_PREBUILT_CONTRIBS_URL=$url" >> "$GITHUB_ENV" || true

      - name: Build (prebuilt third-party libraries from VideoLAN, WLC from source)
        id: prebuilt
        continue-on-error: true
        env:
          VLC_FORCE_KERNELVERSION: ${{ matrix.kernel }}
        run: |
          mkdir build && cd build
          ../extras/package/macosx/build.sh -a ${{ matrix.arch }} -j "$(sysctl -n hw.ncpu)"

      - name: Fallback - build the third-party libraries from source too (slow)
        if: steps.prebuilt.outcome == 'failure'
        env:
          VLC_FORCE_KERNELVERSION: ${{ matrix.kernel }}
        run: |
          # Apple's make 3.81 breaks on parallel contrib builds; use GNU make 4.
          # build.sh resets PATH but keeps $VLC_PATH (as VideoLAN's CI does).
          export VLC_PATH="$(brew --prefix make)/libexec/gnubin"
          "$VLC_PATH/make" --version | head -1
          rm -rf build contrib/*-apple-darwin* && mkdir build && cd build
          ../extras/package/macosx/build.sh -c -a ${{ matrix.arch }} -j "$(sysctl -n hw.ncpu)"

      - name: Save the source-built libraries for the next run
        if: steps.prebuilt.outcome == 'failure'
        continue-on-error: true
        run: |
          HOST=${{ matrix.arch }}-apple-darwin${{ matrix.kernel }}
          cd contrib
          OLD="$PWD/$HOST"
          rm -rf tmp && mkdir tmp && cp -R "$HOST" tmp/
          (cd "tmp/$HOST" && rm -rf share/man share/doc share/gtk-doc share/info man sbin etc \
            && ../../src/change_prefix.sh "$OLD" @@CONTRIB_PREFIX@@)
          tar -c -C tmp "$HOST/" | zstd --quiet --force --threads=0 -12 -c > "vlc-contrib-$HOST-wlc.tar.zst"
          rm -rf tmp; ls -la vlc-contrib-*.tar.zst

      - name: Check the WLC pieces are in the app
        run: |
          cd build
          test -f VLC.app/Contents/MacOS/plugins/libwlc_plugin.dylib
          test -f VLC.app/Contents/MacOS/plugins/libwlceq_plugin.dylib
          test ! -d VLC.app/Contents/Frameworks/Sparkle.framework
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" VLC.app/Contents/Info.plist | grep -x io.github.joshwilk.wlc
          /usr/libexec/PlistBuddy -c "Print :CFBundleName" VLC.app/Contents/Info.plist | grep -x WLC

      - name: Launch check
        continue-on-error: true
        run: |
          APP="$PWD/build/VLC.app/Contents/MacOS/VLC"
          "$APP" --version 2>&1 | head -3
          echo "--- modules WLC needs:"
          "$APP" -I dummy --list 2>/dev/null | grep -E " (wlc|wlceq|avcodec|mp4|mkv|gnutls|http|access_http|macosx) " || true
          echo "--- 12 s headless run with the Control Center:"
          ( "$APP" -I dummy --no-video --aout adummy --wlc-port 48999 -vv > /tmp/wlc-launch.txt 2>&1 & echo $! > /tmp/wlc.pid )
          sleep 10; curl -s -m 5 http://127.0.0.1:48999/api/info || echo "(no answer from the Control Center)"
          kill "$(cat /tmp/wlc.pid)" 2>/dev/null; sleep 1
          grep -iE "wlc|error|warning: cannot|dlopen|symbol" /tmp/wlc-launch.txt | head -40
          echo "--- last lines:"; tail -25 /tmp/wlc-launch.txt

      - name: End-to-end tests against the Mac build
        continue-on-error: true
        run: |
          python3 tools-wlc/e2e.py "$PWD/build/VLC.app/Contents/MacOS/VLC" 2>&1 | tee build/e2e-mac.txt

      - name: Show crash reports, if any
        if: always()
        continue-on-error: true
        run: |
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/VLC* ~/Library/Logs/DiagnosticReports/WLC* 2>/dev/null | head -3); do
            echo "=== $f"
            python3 - "$f" <<'PY'
          import json, sys
          raw = open(sys.argv[1]).read()
          head, _, body = raw.partition('\n')
          try:
              d = json.loads(body)
          except ValueError:
              print(raw[:6000]); sys.exit()
          print('exception:', d.get('exception'), '| termination:', d.get('termination', {}).get('indicator'))
          imgs = d.get('usedImages', [])
          for t in d.get('threads', []):
              if not t.get('triggered'):
                  continue
              for fr in t.get('frames', [])[:25]:
                  img = imgs[fr['imageIndex']].get('name', '?') if fr.get('imageIndex', -1) < len(imgs) else '?'
                  print('  %-28s %s +%s' % (img, fr.get('symbol', '?'), fr.get('symbolLocation', fr.get('imageOffset'))))
          PY
          done

      - name: Package WLC.app into a DMG
        run: |
          cd build
          mv VLC.app WLC.app
          codesign --force --deep --sign - WLC.app
          mkdir dmg && cp -Rp WLC.app dmg/ && ln -s /Applications dmg/Applications
          cp ../README-WLC.md dmg/"Read Me.md"
          hdiutil create -volname "WLC ${WLC_VERSION}" -srcfolder dmg -ov -format UDZO \
            "WLC-${WLC_VERSION}-mac-${{ matrix.label }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: WLC-${{ env.WLC_VERSION }}-mac-${{ matrix.label }}
          path: |
            build/WLC-*.dmg
            build/e2e-mac.txt
