# Builds WLC TV (Android TV / Fire TV), plays real media through it on an
# Android emulator, and publishes WLC-TV.apk at a fixed link for Downloader:
#   https://github.com/joshwilk/wlc/releases/download/wlc-tv/WLC-TV.apk
name: WLC TV for Android TV and Fire TV

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tv/**', 'tools-wlc/wilkcast.py', '.github/workflows/wlc-tv-android.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }

      # Same signing key every build, so updates install over the last one.
      # A WLC_TV_KEYSTORE secret (base64 .jks) wins; otherwise a key kept in the cache.
      - name: Signing key
        id: key
        env:
          KS: ${{ secrets.WLC_TV_KEYSTORE }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > tv/wlc-tv.jks; echo "kind=secret" >> "$GITHUB_OUTPUT"
          else echo "kind=cached" >> "$GITHUB_OUTPUT"; fi
      - name: Keep the fallback signing key between runs
        if: steps.key.outputs.kind == 'cached'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: wlc-tv-signing-key-v1

      - name: Core tests (plain Java)
        run: |
          mkdir -p /tmp/core && javac -d /tmp/core tv/app/src/main/java/io/github/joshwilk/wlctv/core/*.java
          echo "core compiles"

      - name: Build the TV app (ARM, for Fire TV / Android TV)
        env:
          WLC_TV_BUILD: ${{ github.run_number }}
          WLC_TV_KEY_PASS: ${{ secrets.WLC_TV_KEY_PASS }}
        run: |
          gradle -p tv --no-daemon assembleRelease
          cp tv/app/build/outputs/apk/release/app-release.apk WLC-TV.apk
          ls -la WLC-TV.apk

      - name: Build the test app (x86_64, for the emulator)
        env:
          WLC_TV_BUILD: ${{ github.run_number }}
        run: |
          gradle -p tv --no-daemon assembleDebug -Pabis=x86_64
          cp tv/app/build/outputs/apk/debug/app-debug.apk WLC-TV-test-x86_64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: wlc-tv-apks
          path: |
            WLC-TV.apk
            WLC-TV-test-x86_64.apk

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: wlc-tv-apks }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: ffmpeg for test media
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Play media through WLC TV on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SHOTS: ${{ github.workspace }}/shots
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: mkdir -p shots && python3 tv/test/emulator_test.py WLC-TV-test-x86_64.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshots
          path: shots/

  publish:
    needs: [build, emulator-test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: wlc-tv-apks }
      - name: Publish WLC-TV.apk at a fixed link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete wlc-tv --yes --cleanup-tag 2>/dev/null || true
          gh release create wlc-tv WLC-TV.apk --target "$GITHUB_SHA" --prerelease \
            --title "WLC TV for Fire TV and Android TV (build ${{ github.run_number }})" \
            --notes "Install on a Fire TV with the Downloader app: enter
          https://github.com/joshwilk/wlc/releases/download/wlc-tv/WLC-TV.apk

          Built from ${GITHUB_SHA::7}. Passed the emulator playback tests."
