<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WLC Control Center</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M18 8h28l5 46H13z' fill='%23ff6b00'/%3E%3Cpath d='M16.9 18h30.2l.9 8H16zM15 36h34l.9 8H14.1z' fill='%23f4f4f0'/%3E%3Crect x='7' y='53' width='50' height='7' rx='3' fill='%23111'/%3E%3C/svg%3E">
<style>
:root{--bg:#141619;--panel:#1d2025;--panel2:#272b32;--line:#363b45;--text:#eef0f3;--mute:#9aa3b2;
--orange:#ff6b00;--orange2:#ff9440;--white:#f4f4f0;--ok:#3ecf7a;--bad:#ff5a5c;--r:10px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:7px 12px}
button:hover{border-color:var(--orange)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--orange);border-color:var(--orange);color:#160a00;font-weight:700}
button.ghost{background:transparent}
button.small{padding:3px 8px;font-size:12px}
input[type=text],input[type=number],input[type=password],input[type=search],select{background:#111316;border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--orange2);outline-offset:1px}
input[type=range]{accent-color:var(--orange)}
input[type=checkbox]{accent-color:var(--orange);width:16px;height:16px}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
h2{font-size:18px}h3{font-size:13px;color:var(--mute)}
.hazard{height:6px;background:repeating-linear-gradient(135deg,var(--orange) 0 14px,#111 14px 28px);flex:none}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
header .brand{display:flex;align-items:center;gap:10px}
header .brand b{font:800 20px/1 Impact,"Arial Narrow Bold",system-ui;letter-spacing:.12em}
header .brand span{color:var(--mute);font-size:12px}
header .sp{flex:1}
.pill{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:3px 10px;color:var(--mute)}
#wrap{flex:1;display:flex;min-height:0}
nav{width:190px;background:var(--panel);border-right:1px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;gap:4px;flex:none;overflow:auto}
nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:8px;color:var(--mute);font-weight:600}
nav button.on{background:var(--panel2);color:var(--text);box-shadow:inset 3px 0 0 var(--orange)}
nav button svg{width:18px;height:18px;flex:none}
main{flex:1;overflow:auto;padding:18px 20px 30px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.grow{flex:1;min-width:0}
.mute{color:var(--mute)}.small{font-size:12px}.err{color:var(--bad)}.ok{color:var(--ok)}.bad{color:var(--bad)}
.gap{height:14px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--mute);font-weight:600;position:sticky;top:0;background:var(--panel)}
td.name{word-break:break-word}
tr.cur td{color:var(--orange2);font-weight:600}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel2)}
.scroll{max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.tile:hover{border-color:var(--orange)}
.tile .art{aspect-ratio:1;background:#0e0f11 center/cover no-repeat;display:grid;place-items:center;color:#4a505c}
.tile .art svg{width:46%;height:46%}
.tile .cap{padding:8px 10px}.tile .cap b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;padding:6px 12px;color:var(--mute)}
.seg button.on{background:var(--orange);color:#160a00;font-weight:700}
footer{flex:none;background:var(--panel);border-top:1px solid var(--line);padding:8px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
footer .now{min-width:140px;flex:1 1 180px;overflow:hidden}
footer .now b,footer .now span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
footer .tp button{width:38px;height:38px;padding:0;border-radius:50%;display:inline-grid;place-items:center}
footer .tp button.big{width:46px;height:46px;background:var(--orange);border-color:var(--orange);color:#160a00}
footer .tp svg{width:18px;height:18px}
footer .seek{flex:3 1 260px;display:flex;align-items:center;gap:8px}
footer .seek input{flex:1}
footer .vol{display:flex;align-items:center;gap:6px}
footer .vol input{width:90px}
.eq-sliders{display:flex;gap:2px;overflow-x:auto;padding:6px 0}
.eq-band{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:26px}
.eq-band input{writing-mode:vertical-lr;direction:rtl;height:170px;width:22px}
.eq-band span{font-size:10px;color:var(--mute)}
.eq-band b{font-size:10px;font-weight:600}
canvas{width:100%;display:block;border-radius:8px;background:#0e0f11;border:1px solid var(--line)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:20;padding:14px}
.modal>.card{width:min(680px,100%);max-height:90vh;display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#000;border:1px solid var(--orange);padding:9px 14px;border-radius:8px;z-index:30;max-width:90vw}
.bar{height:8px;background:#0e0f11;border-radius:99px;overflow:hidden;min-width:90px}
.bar>i{display:block;height:100%;background:var(--orange)}
.chg{color:var(--orange2)}.clash{color:var(--bad);font-weight:700}
.rule{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rule b{min-width:96px}
.big-pin{font:800 30px/1 ui-monospace,Menlo,monospace;letter-spacing:.18em;color:var(--orange2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
#local-player{position:fixed;right:14px;bottom:84px;width:min(420px,92vw);z-index:15}
#local-player video,#local-player audio{width:100%;border-radius:8px;background:#000;max-height:50vh}
@media (max-width:820px){
 #wrap{flex-direction:column}
 nav{width:auto;flex-direction:row;border-right:0;border-bottom:1px solid var(--line);padding:6px;overflow-x:auto}
 nav button{white-space:nowrap;padding:8px 10px}nav button.on{box-shadow:inset 0 -3px 0 var(--orange)}
 main{padding:12px}.two{grid-template-columns:1fr}
 header .brand span{display:none}
}
</style>
</head>
<body>
<div class="hazard"></div>
<header>
 <div class="brand">
  <svg width="34" height="34" viewBox="0 0 64 64" aria-hidden="true"><path d="M18 8h28l5 46H13z" fill="#ff6b00"/><path d="M16.9 18h30.2l.9 8H16zM15 36h34l.9 8H14.1z" fill="#f4f4f0"/><ellipse cx="32" cy="8" rx="14" ry="3" fill="#c94f00"/><rect x="7" y="53" width="50" height="7" rx="3" fill="#111" stroke="#333"/></svg>
  <div><b>WLC</b><br><span>Wilkinson LAN Client · Control Center</span></div>
 </div>
 <div class="sp"></div>
 <span class="pill" id="who"></span>
</header>
<div id="wrap">
 <nav id="nav"></nav>
 <main id="main"></main>
</div>
<footer id="foot">
 <div class="now"><b id="np-title">Nothing playing</b><span class="mute small" id="np-sub"></span></div>
 <div class="tp row" style="gap:6px">
  <button title="Previous" data-cmd="prev"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
  <button class="big" title="Play / pause" data-cmd="toggle" id="bt-play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg></button>
  <button title="Stop" data-cmd="stop"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h12v12H6z"/></svg></button>
  <button title="Next" data-cmd="next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
 </div>
 <div class="seek"><span class="small mute" id="t-cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek"><span class="small mute" id="t-len">0:00</span></div>
 <div class="vol"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 8a5 5 0 010 8" fill="none" stroke="currentColor" stroke-width="2"/></svg><input type="range" id="vol" min="0" max="150" value="100" aria-label="Volume"></div>
 <button id="bt-cast" title="Cast to another WLC">Cast</button>
</footer>
<div id="local-player" hidden></div>
<script>
'use strict';
/* ---------- tiny helpers ---------- */
const $ = (s, r) => (r || document).querySelector(s);
{ // let replaceChildren take arrays and skip empty entries, like h() does
  const rc = Element.prototype.replaceChildren;
  Element.prototype.replaceChildren = function (...kids) { return rc.apply(this, kids.flat(9).filter(k => k != null && k !== false)); };
}
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const k in (props || {})) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'html') e.innerHTML = v;
    else if (k in e && k !== 'list') e[k] = v;
    else e.setAttribute(k, v);
  }
  for (const kid of kids.flat(9)) if (kid != null && kid !== false) e.append(kid.nodeType ? kid : document.createTextNode(kid));
  return e;
}
async function call(method, path, body) {
  const r = await fetch(path, { method, credentials: 'same-origin',
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined });
  let j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok) { const err = new Error((j && j.error) || ('HTTP ' + r.status)); err.status = r.status; throw err; }
  return j;
}
const GET = p => call('GET', p), POST = (p, b) => call('POST', p, b || {});
const q = o => Object.entries(o).map(([k, v]) => k + '=' + encodeURIComponent(v)).join('&');
function toast(msg, bad) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = h('div', { class: 'toast' + (bad ? ' err' : ''), role: 'status' }, msg);
  document.body.append(t); setTimeout(() => t.remove(), bad ? 6000 : 2600);
}
const fail = e => toast(e.message || String(e), true);
function fmtTime(s) { s = Math.max(0, Math.floor(s || 0)); const hh = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
  return (hh ? hh + ':' + String(m).padStart(2, '0') : m) + ':' + String(ss).padStart(2, '0'); }
function fmtSize(n) { if (!n) return ''; const u = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0; while (n >= 1024 && i < 4) { n /= 1024; i++; } return n.toFixed(i ? 1 : 0) + ' ' + u[i]; }
const base = p => p.slice(p.lastIndexOf('/') + 1);
const dirOf = p => p.slice(0, p.lastIndexOf('/')) || '/';
const natCmp = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' }).compare;
const ICON = {
  play: 'M7 4v16l13-8z', lib: 'M4 4h6v16H4zM12 4h4v16h-4zM18 6l3 .8-3.2 13-3-.8z', eq: 'M5 4h2v7H5zM5 15h2v5H5zM3 11h6v4H3zM11 4h2v3h-2zM11 11h2v9h-2zM9 7h6v4H9zM17 4h2v9h-2zM17 17h2v3h-2zM15 13h6v4h-6z',
  conv: 'M4 7h11l-3-3 1.4-1.4L19.8 8l-6.4 5.4L12 12l3-3H4zM20 17H9l3 3-1.4 1.4L4.2 16l6.4-5.4L12 12l-3 3h11z', ren: 'M3 17.2V21h3.8L18 9.8 14.2 6zM20.7 7a1 1 0 000-1.4l-2.3-2.3a1 1 0 00-1.4 0L15.2 5 19 8.8z',
  net: 'M3 18a3 3 0 013 3H3zM3 14a7 7 0 017 7H8a5 5 0 00-5-5zM3 10a11 11 0 0111 11h-2a9 9 0 00-9-9zM3 5h18v14h-5v-2h3V7H5v1H3z',
  folder: 'M3 6a2 2 0 012-2h5l2 2h7a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2z', note: 'M9 4v11.2A3.5 3.5 0 1011 18V8h7V4z', film: 'M4 4h16v16H4zM6 6v2h2V6zm0 5v2h2v-2zm0 5v2h2v-2zm10-10v2h2V6zm0 5v2h2v-2zm0 5v2h2v-2z', img: 'M4 5h16v14H4zm2 12h12l-4-6-3 4-2-2z'
};
const icon = (n) => h('span', { html: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="' + ICON[n] + '"/></svg>', style: 'display:contents' });

/* ---------- state ---------- */
const S = { info: null, st: null, tab: 'now', lib: null, libKind: 'all', libQ: '', libFolder: null, ui: {}, seeking: false,
  eq: null, conv: { files: [] }, ren: { dir: null, files: [], rules: [], sort: 'name', meta: {} }, peers: [] };
const pins = JSON.parse(localStorage.getItem('wlc-pins') || '{}');
const savePins = () => localStorage.setItem('wlc-pins', JSON.stringify(pins));

/* ---------- player bar ---------- */
async function cmd(c, extra) { try { S.st = await POST('/api/cmd', Object.assign({ cmd: c }, extra)); paintBar(); } catch (e) { fail(e); } }
function paintBar() {
  const s = S.st; if (!s) return;
  $('#np-title').textContent = s.title || (s.state === 'stopped' ? 'Nothing playing' : '…');
  $('#np-sub').textContent = [s.artist, s.album].filter(Boolean).join(' · ') || (s.state !== 'stopped' ? s.state : '');
  $('#bt-play').firstChild.innerHTML = s.state === 'playing' ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>' : '<path d="M7 4v16l13-8z"/>';
  $('#t-cur').textContent = fmtTime(s.time); $('#t-len').textContent = fmtTime(s.length);
  if (!S.seeking) $('#seek').value = s.length > 0 ? Math.round(s.time / s.length * 1000) : 0;
  if (document.activeElement !== $('#vol') && s.volume >= 0) $('#vol').value = Math.round(s.volume * 100);
}
$('#foot').addEventListener('click', e => { const b = e.target.closest('[data-cmd]'); if (b) cmd(b.dataset.cmd); });
$('#seek').addEventListener('input', () => { S.seeking = true; });
$('#seek').addEventListener('change', e => { S.seeking = false; if (S.st && S.st.length > 0) cmd('seek', { value: e.target.value / 1000 * S.st.length }); });
$('#vol').addEventListener('input', e => cmd('volume', { value: e.target.value / 100 }));
$('#bt-cast').addEventListener('click', () => castMenu(null));
async function poll() {
  if (!document.hidden && S.info && S.info.authed) {
    try { S.st = await GET('/api/status'); paintBar(); if (S.tab === 'now') paintNowLive(); } catch (e) {}
  }
  setTimeout(poll, 1000);
}

/* ---------- navigation ---------- */
const TABS = [['now', 'Now Playing', 'play'], ['lib', 'Media Center', 'lib'], ['eq', 'Power EQ', 'eq'],
  ['conv', 'Converter', 'conv', true], ['ren', 'Bulk Renamer', 'ren', true], ['net', 'Network & Cast', 'net']];
function paintNav() {
  const nav = $('#nav'); nav.replaceChildren();
  for (const [id, label, ic, localOnly] of TABS) {
    if (localOnly && !S.info.local) continue;
    nav.append(h('button', { class: S.tab === id ? 'on' : '', onclick: () => go(id) }, icon(ic), label));
  }
}
function go(tab) { S.tab = tab; paintNav(); render(); }
function render() {
  const m = $('#main'); m.replaceChildren();
  ({ now: viewNow, lib: viewLib, eq: viewEq, conv: viewConv, ren: viewRen, net: viewNet })[S.tab](m);
}

/* ---------- login (other devices) ---------- */
function viewLogin() {
  $('#foot').hidden = true; $('#nav').hidden = true;
  const pin = h('input', { type: 'password', inputMode: 'numeric', maxLength: 6, placeholder: '6-digit PIN', style: 'font-size:22px;width:190px;text-align:center', autofocus: true });
  const msg = h('div', { class: 'err small' });
  const submit = async () => { try { await POST('/api/login', { pin: pin.value }); location.reload(); } catch (e) { msg.textContent = e.message; } };
  pin.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  $('#main').replaceChildren(h('div', { class: 'card col', style: 'max-width:420px;margin:8vh auto;align-items:center;text-align:center' },
    h('h2', null, S.info.name), h('p', { class: 'mute' }, 'Enter the PIN shown in the Network & Cast tab of WLC on that computer.'),
    pin, h('button', { class: 'primary', onclick: submit }, 'Connect'), msg));
}

/* ---------- Now Playing ---------- */
function viewNow(m) {
  m.append(h('div', { class: 'two' },
    h('div', { class: 'card col' }, h('h2', null, 'Now Playing'),
      h('div', { class: 'row', style: 'align-items:flex-start' },
        h('div', { id: 'np-art', style: 'width:150px;height:150px;border-radius:10px;background:#0e0f11 center/cover no-repeat;flex:none;display:grid;place-items:center;color:#4a505c' }),
        h('div', { class: 'col grow' }, h('div', { id: 'np-big', style: 'font-size:20px;font-weight:700' }), h('div', { id: 'np-big2', class: 'mute' }),
          h('div', { class: 'row' },
            h('button', { id: 'np-rand', onclick: () => cmd('random') }, 'Shuffle'),
            h('button', { id: 'np-loop', onclick: () => cmd('loop') }, 'Repeat all'),
            h('button', { id: 'np-rep', onclick: () => cmd('repeat') }, 'Repeat one')),
          h('div', { class: 'row' }, h('span', { class: 'mute small' }, 'Speed'),
            h('select', { id: 'np-rate', onchange: e => cmd('rate', { value: +e.target.value }) },
              [0.5, 0.75, 1, 1.25, 1.5, 2, 3].map(r => h('option', { value: r }, r + '×'))),
            h('button', { class: 'small', onclick: () => cmd('seekrel', { value: -10 }) }, '−10 s'),
            h('button', { class: 'small', onclick: () => cmd('seekrel', { value: 30 }) }, '+30 s'),
            h('button', { class: 'small', onclick: () => cmd('fullscreen') }, 'Fullscreen'))))),
    h('div', { class: 'card col' }, h('div', { class: 'row' }, h('h2', { class: 'grow' }, 'Queue'),
        h('button', { class: 'small', onclick: () => pickFiles(async paths => { await cmd('add', { paths, play: false }); loadQueue(); }) }, 'Add files…'),
        h('button', { class: 'small', onclick: async () => { await cmd('clear'); loadQueue(); } }, 'Clear')),
      h('div', { class: 'scroll', id: 'queue' }))));
  S.artFor = null; paintNowLive(); loadQueue();
}
function paintNowLive() {
  const s = S.st; if (!s || !$('#np-big')) return;
  $('#np-big').textContent = s.title || 'Nothing playing';
  $('#np-big2').textContent = [s.artist, s.album].filter(Boolean).join(' · ');
  $('#np-rand').className = s.random ? 'primary' : ''; $('#np-loop').className = s.loop ? 'primary' : ''; $('#np-rep').className = s.repeat ? 'primary' : '';
  if (document.activeElement !== $('#np-rate')) $('#np-rate').value = [0.5, 0.75, 1, 1.25, 1.5, 2, 3].reduce((a, b) => Math.abs(b - s.rate) < Math.abs(a - s.rate) ? b : a);
  if (S.artFor !== s.path) {
    S.artFor = s.path; const el = $('#np-art'); el.style.backgroundImage = ''; el.replaceChildren(icon('note'));
    if (s.path) { const img = new Image(); img.onload = () => { if (S.artFor === s.path) { el.replaceChildren(); el.style.backgroundImage = 'url(' + img.src + ')'; } }; img.src = '/api/art?t=' + Date.now(); }
    if (S.queueTimer) clearTimeout(S.queueTimer); S.queueTimer = setTimeout(loadQueue, 400);
  }
}
async function loadQueue() {
  const box = $('#queue'); if (!box) return;
  try {
    const { items } = await GET('/api/playlist');
    box.replaceChildren(items.length ? h('table', null, items.map((it, i) => h('tr', { class: 'click' + (it.current ? ' cur' : ''), onclick: () => cmd('goto', { id: it.id }).then(loadQueue) },
      h('td', { class: 'mute', style: 'width:34px' }, i + 1), h('td', { class: 'name' }, it.name, it.artist ? h('span', { class: 'mute' }, ' · ' + it.artist) : null),
      h('td', { class: 'mute', style: 'width:60px;text-align:right' }, it.duration > 0 ? fmtTime(it.duration) : ''))))
      : h('p', { class: 'mute', style: 'padding:14px' }, 'The queue is empty. Add something from the Media Center.'));
  } catch (e) {}
}

/* ---------- folder / file picker ---------- */
function picker(mode, done) {
  let cur = '', sel = new Set(), entries = [];
  const list = h('div', { class: 'scroll', style: 'max-height:50vh' }), where = h('div', { class: 'small mute', style: 'word-break:break-all' });

  try { await withPin(peer, pin => POST('/api/cast/send', Object.assign({ peer: peer.id, pin, move: !!move }, body))); toast('Casting ' + (Array.isArray(what) && what.length > 1 ? what.length + ' files ' : '') + 'to ' + peer.name); S.castPeer = peer.id; }
  catch (e) { if (e.status === 401) { delete pins[peer.id]; savePins(); } fail(e); }
}
async function castMenu(path) {
  await loadPeers();
  const many = Array.isArray(path);
  const box = h('div', { class: 'modal', onclick: e => { if (e.target === box) box.remove(); } }, h('div', { class: 'card', style: 'width:min(460px,100%)' },
    h('h2', null, many ? 'Cast ' + path.length + ' files to…' : path ? 'Cast this file to…' : 'Cast what is playing to…'),
    S.peers.length ? S.peers.map(p => h('div', { class: 'rule' }, h('div', { class: 'grow' }, h('b', null, (p.kind === 'browser' ? '🖵 ' : '') + p.name), h('div', { class: 'mute small' }, peerTag(p))),
      h('button', { class: 'primary', onclick: () => { box.remove(); castTo(p, path, false); } }, 'Cast'),
      path ? null : h('button', { title: 'Continue there from the same spot and stop here', onclick: () => { box.remove(); castTo(p, path, true); } }, 'Move'))) : h('p', { class: 'mute' }, 'Nothing to cast to yet. Start WLC on another computer, or open ' + screenUrl() + ' on a TV, phone or laptop browser to make it a screen.'),
    h('div', { class: 'row' }, h('span', { class: 'grow' }), h('button', { onclick: () => box.remove() }, 'Close'))));
  document.body.append(box);
}
let netTimer = null;

  const url = a => 'http://' + a + ':' + i.port + '/';
  const scr = i.lan && i.addrs && i.addrs.length ? h('div', { class: 'card col' }, h('h3', null, 'Make any screen a cast target'),
    h('p', { class: 'mute small', style: 'margin:0' }, 'On a smart TV, phone, tablet or spare laptop on this network, open this address in its web browser and enter the PIN. It then shows up as a WilkCast screen for every WLC here.'),
    i.addrs.map(a => h('div', { style: 'font:600 15px ui-monospace,Menlo,monospace;color:var(--orange2)' }, url(a) + 'screen')),
    h('p', { class: 'mute small', style: 'margin:0' }, 'Browsers play MP4 (H.264), WebM, MP3, AAC, FLAC and WAV. For other formats cast to a WLC, or convert first.')) : null;
  const left = h('div', { class: 'card col' }, h('h3', null, 'This WLC'));
  if (i.local) {
    const name = h('input', { type: 'text', value: i.name, class: 'grow' });
    left.append(h('div', { class: 'row' }, h('span', { style: 'width:110px' }, 'Name'), name, h('button', { onclick: () => saveSet({ name: name.value }) }, 'Save')),
      h('div', { class: 'row' }, h('span', { style: 'width:110px' }, 'PIN'), h('span', { class: 'big-pin' }, i.pin), h('span', { class: 'grow' }), h('button', { onclick: () => { if (confirm('Make a new PIN? Phones and other devices will have to sign in again.')) saveSet({ newPin: true }); } }, 'New PIN')),
      h('div', null, h('div', { class: 'mute small' }, 'Open this on a phone, tablet or another computer on the same network:'),
        i.lan ? (i.addrs.length ? i.addrs.map(a => h('div', { style: 'font:600 15px ui-monospace,Menlo,monospace;color:var(--orange2)' }, url(a))) : h('div', { class: 'mute' }, 'No network connection found.')) : h('div', { class: 'mute' }, 'LAN access is switched off.')),
      h('label', { class: 'row' }, h('input', { type: 'checkbox', checked: i.lan, onchange: e => saveSet({ lan: e.target.checked }).then(() => toast('Restart WLC for this to take effect')) }), 'Let other devices on my network connect (PIN required)'),
      h('div', { class: 'row' }, h('span', null, 'Casts sent to this WLC'), h('select', { onchange: e => saveSet({ castAccept: e.target.value }) },
        [['pin', 'need the PIN'], ['open', 'are accepted from anyone on the network'], ['off', 'are refused']].map(([v, l]) => h('option', { value: v, selected: i.castAccept === v }, l)))),
      h('p', { class: 'mute small', style: 'margin:0' }, 'Other devices can browse and play the folders in your Media Center and use the remote. Converting, renaming and these settings only work on this computer.'));
  } else left.append(h('p', null, 'Connected to ', h('b', null, i.name), '.'), h('p', { class: 'mute small' }, 'You are using it from another device: you can browse, play, cast and use the EQ. File tools stay on that computer.'));
  const host = h('input', { type: 'text', placeholder: '192.168.1.20', style: 'width:150px' });
  const right = h('div', { class: 'card col' }, h('div', { class: 'row' }, h('h3', { class: 'grow' }, 'Cast targets on this network (WilkCast)'), h('button', { class: 'small', onclick: paintDevs }, 'Refresh')), devs,
    h('div', { class: 'row' }, h('span', { class: 'small mute' }, 'Not listed? Add by address'), host, h('button', { onclick: async () => { try { await POST('/api/peers/add', { host: host.value.trim() }); host.value = ''; paintDevs(); } catch (e) { fail(e); } } }, 'Add')));

      const ctl = (c, label, extra) => h('button', { class: 'small', onclick: async () => { try { await withPin(p, pin => POST('/api/cast/control', Object.assign({ peer: p.id, pin, cmd: c }, extra))); paintDevs(); } catch (e) { fail(e); } } }, label);
      return h('div', { class: 'rule' }, h('div', { class: 'grow' }, h('b', null, (p.kind === 'browser' ? '🖵 ' : '') + p.name), ' ', h('span', { class: 'mute small' }, peerTag(p) + (p.auth === 'off' ? ' · not accepting casts' : '')),

        h('button', { class: 'small primary', onclick: () => castTo(p, null, false).then(paintDevs) }, 'Cast current'), ctl('toggle', 'Play/Pause'), ctl('seekrel', '−10 s', { value: -10 }), ctl('seekrel', '+30 s', { value: 30 }), ctl('stop', 'Stop')); }));

  paintDevs();
}

/* ---------- boot ---------- */
async function refreshInfo() { S.info = await GET('/api/info'); $('#who').textContent = S.info.name + (S.info.local ? '' : ' · remote'); }
(async function boot() {
  try { await refreshInfo(); } catch (e) { $('#main').textContent = 'WLC is not answering.'; return; }
  if (!S.info.authed) return viewLogin();
  try { S.ui = await GET('/api/ui'); } catch (e) {}
  paintNav(); render(); poll();
  window.addEventListener('resize', () => { if (S.tab === 'eq') render(); });
})();
</script>
